<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel de Gestão - Admin</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f4f8; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1100px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { color: #004080; margin-top: 0; }
        .cards { display: flex; gap: 20px; margin-top: 25px; }
        .card { flex: 1; background: #f8f9fa; padding: 20px; border-radius: 6px; border-left: 5px solid #004080; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .card h3 { margin: 0 0 10px 0; color: #555; font-size: 1rem; }
        .card p { font-size: 1.8rem; font-weight: bold; color: #004080; margin: 0; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Menu de Abas Fixo -->
        <div style="background-color: #004080; padding: 15px 20px; border-radius: 6px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center;">
            <div>
                <a href="{{ url_for('admin_ocorrencias') }}" style="color: white; text-decoration: none; font-weight: bold; margin-right: 20px; padding: 8px 12px; border-radius: 4px; background: rgba(255,255,255,0.1);">📍 Novas Ocorrências</a>
                <a href="{{ url_for('admin_painel') }}" style="color: white; text-decoration: none; font-weight: bold; margin-right: 20px; padding: 8px 12px; border-radius: 4px; background: rgba(255,255,255,0.3);">📊 Painel de Gestão</a>
                <a href="{{ url_for('admin_reparos') }}" style="color: white; text-decoration: none; font-weight: bold; padding: 8px 12px; border-radius: 4px; background: rgba(255,255,255,0.1);">🛠️ Relatos de Reparos</a>
            </div>
            <div>
                <a href="{{ url_for('logout') }}" style="color: #ffcccc; text-decoration: none; font-weight: bold;">Sair da Conta</a>
            </div>
        </div>

        <h2>📊 Painel de Controle e Estatísticas</h2>
        <p>Visão geral dos dados consolidados no sistema do Projeto Integrador.</p>

        <div class="cards">
            <div class="card">
                <h3>Total de Ocorrências Recebidas</h3>
                <p>{{ total_denuncias }}</p>
            </div>
            <div class="card">
                <h3>Total de Reparos Relatados</h3>
                <p>{{ total_reparos }}</p>
            </div>
        </div>
    </div>
</body>
</html>
